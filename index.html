<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оставить заявку на курс</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <section class="application" aria-labelledby="application-title">
              <header class="application__header">
                <h1 class="application__title" id="application-title">
                  Оставить заявку на курс
                </h1>
                <p class="application__subtitle">Шаг 3. Заполнение формы</p>
              </header>

              <form
                class="application__form"
                id="application-form"
                action="#"
                method="post"
                novalidate
              >
                <!-- Name -->
                <div class="field">
                  <label class="field__label" for="name">
                    Как к Вам обращаться?
                    <span class="field__required" aria-hidden="true">*</span>
                  </label>
                  <div class="field__control field__control--icon">
                    <span class="field__icon" aria-hidden="true">
                      <i class="bi bi-person-circle"></i>
                    </span>
                    <input
                      class="form-control field__input"
                      type="text"
                      id="name"
                      name="name"
                      placeholder="Как к Вам обращаться?"
                      autocomplete="name"
                      required
                      aria-describedby="name-error"
                    />
                  </div>
                  <p class="field__error" id="name-error" role="alert" hidden></p>
                </div>

                <!-- Email -->
                <div class="field">
                  <label class="field__label" for="email">
                    Ваш email
                    <span class="field__required" aria-hidden="true">*</span>
                  </label>
                  <div class="field__control field__control--icon">
                    <span class="field__icon" aria-hidden="true">
                      <i class="bi bi-envelope"></i>
                    </span>
                    <input
                      class="form-control field__input"
                      type="email"
                      id="email"
                      name="email"
                      placeholder="Введите email"
                      autocomplete="email"
                      required
                      aria-describedby="email-error"
                    />
                  </div>
                  <p class="field__error" id="email-error" role="alert" hidden></p>
                </div>

                <!-- Course -->
                <div class="field" id="field-course">
                  <label class="field__label" for="course">
                    Выберите интересующий курс
                    <span class="field__required" aria-hidden="true">*</span>
                  </label>
                  <div class="field__control field__control--select">
                    <select
                      class="form-select field__select"
                      id="course"
                      name="course"
                      required
                      aria-describedby="course-error"
                    >
                      <option value="">Не выбрано</option>
                    </select>
                    <button
                      class="field__reset"
                      type="button"
                      id="course-reset"
                      aria-label="Сбросить выбор курса"
                      title="Сбросить"
                    >
                      <i class="bi bi-x" aria-hidden="true"></i>
                    </button>
                  </div>
                  <p class="field__error" id="course-error" role="alert" hidden></p>
                </div>

                <!-- Program (shown after a course is selected) -->
                <div class="field field--hidden" id="field-program" hidden>
                  <label class="field__label" for="program">
                    Выберите программу
                    <span class="field__required" aria-hidden="true">*</span>
                  </label>
                  <div class="field__control field__control--select">
                    <select
                      class="form-select field__select"
                      id="program"
                      name="program"
                      disabled
                      required
                      aria-describedby="program-error"
                    >
                      <option value="">Не выбрано</option>
                    </select>
                  </div>
                  <p class="field__error" id="program-error" role="alert" hidden></p>
                </div>

                <!-- Comments -->
                <div class="field">
                  <label class="field__label" for="comment">Комментарии</label>
                  <div class="field__control">
                    <textarea
                      class="form-control field__textarea"
                      id="comment"
                      name="comment"
                      rows="4"
                    ></textarea>
                  </div>
                </div>

                <!-- Consents -->
                <fieldset class="consents">
                  <legend class="consents__title">Персональные данные</legend>

                  <div class="form-check consents__item" id="consent-personal-item">
                    <input
                      class="form-check-input consents__checkbox"
                      type="checkbox"
                      id="consent-personal"
                      name="consent-personal"
                      required
                      aria-describedby="consent-personal-error"
                    />
                    <label class="form-check-label consents__label" for="consent-personal">
                      Я даю
                      <a class="consents__link" href="#" target="_blank" rel="noopener noreferrer"
                        >согласие на обработку персональных данных</a
                      >
                    </label>
                  </div>
                  <p class="field__error" id="consent-personal-error" role="alert" hidden></p>

                  <div class="form-check consents__item" id="consent-privacy-item">
                    <input
                      class="form-check-input consents__checkbox"
                      type="checkbox"
                      id="consent-privacy"
                      name="consent-privacy"
                      required
                      aria-describedby="consent-privacy-error"
                    />
                    <label class="form-check-label consents__label" for="consent-privacy">
                      Я подтверждаю, что ознакомился с
                      <a class="consents__link" href="#" target="_blank" rel="noopener noreferrer"
                        >Политикой конфиденциальности</a
                      >
                    </label>
                  </div>
                  <p class="field__error" id="consent-privacy-error" role="alert" hidden></p>
                </fieldset>

                <button class="btn application__submit" type="submit" id="submit-btn">
                  <span class="application__submit-label">Отправить</span>
                  <span class="application__submit-spinner" hidden>
                    <span
                      class="spinner-border spinner-border-sm"
                      role="status"
                      aria-hidden="true"
                    ></span>
                    Отправка…
                  </span>
                </button>
              </form>
            </section>
          </div>
        </div>
      </div>
    </main>

    <!-- Success modal -->
    <div
      class="modal fade"
      id="success-modal"
      tabindex="-1"
      aria-labelledby="success-modal-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="success-modal-title">Заявка принята</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Закрыть"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-2">Спасибо! Мы получили вашу заявку.</p>
            <p class="mb-1">
              <strong>Курс:</strong>
              <span id="success-course-name"></span>
            </p>
            <p class="mb-0">
              <strong>Программа:</strong>
              <span id="success-program-name"></span>
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Закрыть
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
